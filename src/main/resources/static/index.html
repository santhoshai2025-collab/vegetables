<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Item Selector</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; text-align: center; }
        table { border-collapse: collapse; width: 80%; margin: 15px auto; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .option {
            display: inline-block;
            margin: 4px;
            padding: 10px 14px;        /* more padding for round look */
            border: 1px solid #ccc;
            border-radius: 50%;        /* makes it perfectly round */
            cursor: pointer;
            text-align: center;        /* centers the text inside */
        }

        .option.selected {
            background-color: #4caf50;
            color: white;
            border-color: #388e3c;
        }
        button {
            margin: 8px; padding: 8px 12px;
            background: #4caf50; color: white;
            border: none; border-radius: 4px; cursor: pointer;
        }
        button:hover { background: #388e3c; }
        .hidden { display: none; }
        #selection { margin-top: 20px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
<h2>Select Items and Quantities</h2>

<!-- Toggle buttons -->
<button onclick="showTable('vegetables')">Vegetables</button>
<button onclick="showTable('provisionals')">Provisionals</button>
<button onclick="showTable('special')">Special Items</button>

<!-- Vegetables Table -->
<table id="vegetablesTable" class="hidden">
    <thead><tr><th>Vegetable</th><th>Quantity</th></tr></thead>
    <tbody id="vegTableBody"></tbody>
</table>
<button id="vegSubmitBtn" class="hidden" onclick="sendVegetables()">Submit Vegetables</button>

<!-- Provisionals Table -->
<table id="provisionalsTable" class="hidden">
    <thead><tr><th>Item</th><th>Quantity</th></tr></thead>
    <tbody id="provTableBody"></tbody>
</table>
<button id="provSubmitBtn" class="hidden" onclick="sendProvisionals()">Submit Provisionals</button>

<!-- Special Items Table -->
<table id="specialTable" class="hidden">
    <thead><tr><th>Item</th><th>Quantity</th></tr></thead>
    <tbody id="specialTableBody"></tbody>
</table>
<button id="specialSubmitBtn" class="hidden" onclick="sendSpecial()">Submit Special Items</button>

<p id="selection"></p>

<script>
    const vegetables = [
        { display: "🥕 Carrot (காரட்)", sms: "Carrot" },
        { display: "🥔 Potato (உருளைக்கிழங்கு)", sms: "Potato" },
        { display: "🍅 Tomato (தக்காளி)", sms: "Tomato" },
        { display: "🧅 Onion (வெங்காயம்)", sms: "Onion" },
        { display: "🌱 DrumStick (முருங்கைக்காய்)", sms: "DrumStick" },
        { display: "🍆 Brinjal (கத்தரிக்காய்)", sms: "Brinjal" },
        { display: "🥒 Ivy Gourd (கோவைக்காய்)", sms: "Ivy Gourd" },
        { display: "🌱 Beans (பீன்ஸ்)", sms: "Beans" },
        { display: "🌱 Broad Beans (அவரைக்காய்)", sms: "Broad Beans" },
        { display: "🍠 Taro Root (கருணைக்கிழங்கு)", sms: "Taro Root" },
        { display: "🍠 Elephant Yam (சேனைக்கிழங்கு)", sms: "Elephant Yam" },
        { display: "🌱 Ginger (இஞ்சி)", sms: "Ginger" },
        { display: "🌶️ Green Chili (பச்சை மிளகாய்)", sms: "Green Chili" },
        { display: "🌿 Mint (புதினா)", sms: "Mint" },
        { display: "🔴 Beetroot (பீட்ரூட்)", sms: "Beetroot" },
        { display: "🌿 Arai Keerai (அரை கீரை)", sms: "Arai Keerai" },
        { display: "🌿 Siru Keerai (சிறு கீரை)", sms: "Siru Keerai" },
        { display: "🍄 Mushroom (காளான்)", sms: "Mushroom" },
        { display: "🌽 Corn (சோளம்)", sms: "Corn" },
        { display: "🥬 Cabbage (முட்டைக்கோசு)", sms: "Cabbage" },
        { display: "🥦 Cauliflower (பூக்கோசு)", sms: "Cauliflower" },
        { display: "🥒 Ridge Gourd (பீர்க்கங்காய்)", sms: "Ridge Gourd" },
        { display: "🥒 Bottle Gourd (சுரைக்காய்)", sms: "Bottle Gourd" },
        { display: "🥒 Snake Gourd (புடலங்காய்)", sms: "Snake Gourd" },
        { display: "🥒 Bitter Gourd (பாகற்காய்)", sms: "Bitter Gourd" }
    ];

    const provisionals = [
        { display: "🌰 Mustard Seeds (கடுகு)", sms: "Mustard Seeds" },
        { display: "🌰 Cumin Seeds (சீரகம்)", sms: "Cumin Seeds" },
        { display: "🌿 Coriander Seeds (கொத்தமல்லி விதை)", sms: "Coriander Seeds" },
        { display: "🌶️ Chili Powder (மிளகாய் தூள்)", sms: "Chili Powder" },
        { display: "🟡 Turmeric Powder (மஞ்சள் தூள்)", sms: "Turmeric Powder" },
        { display: "⚫ Black Pepper (மிளகு)", sms: "Black Pepper" },
        { display: "🧂 Salt (உப்பு)", sms: "Salt" },
        { display: "🍚 Rice (அரிசி)", sms: "Rice" },
        { display: "🌾 Wheat Flour (கோதுமை மாவு)", sms: "Wheat Flour" },
        { display: "🍲 Toor Dal (துவரம் பருப்பு)", sms: "Toor Dal" },
        { display: "🥣 Urad Dal (உளுந்து பருப்பு)", sms: "Urad Dal" },
        { display: "🥬 Moong Dal (பாசிப்பருப்பு)", sms: "Moong Dal" },
        { display: "🥜 Groundnut (வேர்க்கடலை)", sms: "Groundnut" },
        { display: "🥥 Coconut Oil (தேங்காய் எண்ணெய்)", sms: "Coconut Oil" },
        { display: "🫒 Gingelly Oil (நல்லெண்ணெய்)", sms: "Gingelly Oil" },
        { display: "🥛 Ghee (நெய்)", sms: "Ghee" },
        { display: "🍯 Jaggery (வெல்லம்)", sms: "Jaggery" },
        { display: "🍬 Sugar (சர்க்கரை)", sms: "Sugar" },
        { display: "🥤 Tamarind (புளி)", sms: "Tamarind" },
        { display: "🥗 Fenugreek Seeds (வெந்தயம்)", sms: "Fenugreek Seeds" },
        { display: "🥫 Sambar Powder (சாம்பார் பொடி)", sms: "Sambar Powder" },
        { display: "🥫 Rasam Powder (ரசம் பொடி)", sms: "Rasam Powder" }
    ];

    const specialItems = [
        { display: "🥚 Eggs (முட்டை)", sms: "Eggs" },
        { display: "🍜 Maggi Noodles (மக்ஜி நூடுல்ஸ்)", sms: "Maggi Noodles" },
        { display: "🌴 Dates (பேரிச்சம்பழம்)", sms: "Dates" },
        { display: "🥜 Mixed Nuts (மிக்ஸ் நட்ஸ்)", sms: "Mixed Nuts" },
        { display: "🥜 Cashew (முந்திரி)", sms: "Cashew" },
        { display: "🥜 Almonds (பாதாம்)", sms: "Almonds" },
        { display: "🥜 Pistachios (பிஸ்தா)", sms: "Pistachios" },
        { display: "🥜 Walnuts (அக்ரோட்)", sms: "Walnuts" },
        { display: "🥛 Milk (பால்)", sms: "Milk" },
        { display: "🧀 Paneer (பனீர்)", sms: "Paneer" },
        { display: "🍞 Bread (ரொட்டி)", sms: "Bread" },
        { display: "🍪 Biscuits (பிஸ்கட்)", sms: "Biscuits" },
        { display: "🍫 Chocolate (சாக்லேட்)", sms: "Chocolate" },
        { display: "🥤 Soft Drinks (சோடா)", sms: "Soft Drinks" }
    ];

    const vegTableBody = document.getElementById("vegTableBody");
    const provTableBody = document.getElementById("provTableBody");
    const specialTableBody = document.getElementById("specialTableBody");

    let selections = {};

    function createRow(item, options, category) {
        const row = document.createElement("tr");
        const itemCell = document.createElement("td");
        itemCell.textContent = item.display;   // show emoji + Tamil
        const qtyCell = document.createElement("td");
        options.forEach(opt => {
            const span = document.createElement("span");
            span.textContent = opt;
            span.classList.add("option");
            span.onclick = () => selectOption(span, item.sms, opt, category); // save English for SMS
            qtyCell.appendChild(span);
        });
        row.appendChild(itemCell);
        row.appendChild(qtyCell);
        return row;
    }

    function selectOption(element, item, qty, category) {
        // If the clicked option is already selected → unselect it
        if (element.classList.contains('selected')) {
            element.classList.remove('selected');

            if (selections[category]) {
                delete selections[category][item];
                // If no items left in this category, remove the category
                if (Object.keys(selections[category]).length === 0) {
                    delete selections[category];
                }
            }
            return; // stop here
        }

        // Otherwise → select this option and unselect siblings
        element.parentNode.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
        element.classList.add('selected');

        if (!selections[category]) selections[category] = {};
        selections[category][item] = qty;
    }


    // Build vegetable rows
    vegetables.forEach(veg => {
        let opts;
        if (veg.sms.includes("Keerai") || veg.sms.includes("DrumStick") || veg.sms.includes("Mushroom")|| veg.sms.includes("Mint")) {
            opts = ["1","2","3"]; // counts
        }  else {
            opts = ["1/4k","1/2k","1kg","2kg"]; // grams/kg
        }
        vegTableBody.appendChild(createRow(veg, opts, "vegetables"));
    });

    // Build provisionals rows
    provisionals.forEach(item => {
        let opts;
        if (item.sms.includes("Oil")){
            opts = ["1/4l","1/2l","1l","2l"]; // grams/kg
        }   else if (item.sms.includes("Seeds") || item.sms.includes("Powder")){
            opts = ["50gm","100gm","250gm"]; // grams/kg
        }   else {
            opts = ["1/4k","1/2k","1kg","2kg"]; // grams/kg
        }
        provTableBody.appendChild(createRow(item, opts, "provisionals"));
    });

    // Build special items rows
    specialItems.forEach(item => {
        let opts;
        if (item.sms.includes("Eggs")) opts = ["6","12"];
        else if (item.sms.includes("Maggi")) opts = ["1 pack","2 packs","5 packs"];
        else opts = ["1/4k","1/2k","1kg","2kg"]
        specialTableBody.appendChild(createRow(item, opts, "special"));
    });

    function showTable(type) {
        document.getElementById("vegetablesTable").classList.add("hidden");
        document.getElementById("provisionalsTable").classList.add("hidden");
        document.getElementById("specialTable").classList.add("hidden");
        document.getElementById("vegSubmitBtn").classList.add("hidden");
        document.getElementById("provSubmitBtn").classList.add("hidden");
        document.getElementById("specialSubmitBtn").classList.add("hidden");

        if (type === "vegetables") {
            document.getElementById("vegetablesTable").classList.remove("hidden");
            document.getElementById("vegSubmitBtn").classList.remove("hidden");
        } else if (type === "provisionals") {
            document.getElementById("provisionalsTable").classList.remove("hidden");
            document.getElementById("provSubmitBtn").classList.remove("hidden");
        } else if (type === "special") {
            document.getElementById("specialTable").classList.remove("hidden");
            document.getElementById("specialSubmitBtn").classList.remove("hidden");
        }
    }

    function sendVegetables() {
        sendMessage(selections["vegetables"]);
    }
    function sendProvisionals() {
        sendMessage(selections["provisionals"]);
    }
    function sendSpecial() {
        sendMessage(selections["special"]);
    }

    function sendMessage(sectionSelections) {
        if (!sectionSelections) {
            document.getElementById("selection").textContent = "No items selected.";
            return;
        }
        const items = Object.entries(sectionSelections).map(([item, qty]) => `${item} - ${qty}`);
        const message = "----Items List----\n" + items.join("\n");
        document.getElementById("selection").textContent = "You selected:\n" + items.join("\n");

        fetch("/api/sendSms", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: message })
        })
            .then(res => res.text())
            .then(data => alert("SMS sent: " + data))
            .catch(err => alert("Error sending SMS: " + err));
    }
</script>

</body>
</html>
